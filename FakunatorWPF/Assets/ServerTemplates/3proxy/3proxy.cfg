# 3proxy config для github .deb (v0.9.5) — этот бинарь скомпилен с особенностями:
# 1) Не пишет в /var/log/3proxy (даже с корректным chown) — падает "No such file or directory".
#    Убираем log-директиву, systemd/journal ловит вывод.
# 2) users с $-префиксом требует ФАЙЛА на абсолютном пути — /etc/3proxy/passwd
#    (инсталлер создаёт его рядом с этим конфигом).
# 3) Никакого daemon/service/chroot — systemd Type=simple, минимальный foreground режим.
nscache 65535
nserver 1.1.1.1
nserver 1.0.0.1
timeouts 1 5 30 60 180 1800 15 60
maxconn 5000
users $/etc/3proxy/passwd
auth strong
allow admin
socks -n -a -p3221
flush
