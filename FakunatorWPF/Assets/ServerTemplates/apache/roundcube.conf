# Roundcube webmail alias — доступ на https://{webmail_host}/
# Подключается как DocumentRoot для webmail поддомена, плюс /webmail alias на основном.

Alias /webmail /var/lib/roundcube/public_html

<Directory /var/lib/roundcube/public_html>
    Options +FollowSymLinks
    <IfVersion >= 2.3>
        Require all granted
    </IfVersion>
    <IfVersion < 2.3>
        Order allow,deny
        Allow from all
    </IfVersion>
</Directory>

<Directory /var/lib/roundcube/public_html/config>
    Options -FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/lib/roundcube/public_html/temp>
    Options -FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

<Directory /var/lib/roundcube/public_html/logs>
    Options -FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>
